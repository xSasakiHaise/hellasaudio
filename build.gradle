plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'java'
}

group = "com.xsasakihaise.hellasaudio"
version = "1.0.0"
archivesBaseName = "hellasaudio"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8) // Forge 1.16.5 requires Java 8
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
}

repositories {
    mavenCentral()
    maven {
        url 'https://repo.lucko.me/'
        content {
            includeGroup 'net.luckperms'
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup 'com.github.xSasakiHaise'
        }
    }
    flatDir { dirs 'libs' }
}

dependencies {
    compileOnly fg.deobf('com.github.xSasakiHaise:hellascontrol:2.0.0')
    compileOnly fg.deobf(fileTree(dir: 'libs', include: ['*control*.jar']))
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
}


jar {
    manifest {
        attributes(
                "Specification-Title": "HellasAudio",
                "Specification-Vendor": "xSasaki_Haise",
                "Specification-Version": "1",
                "Implementation-Title": "HellasAudio",
                "Implementation-Version":"1.0.0",
                "Implementation-Vendor": "xSasaki_Haise"
        )
    }
}
